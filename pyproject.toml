[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "beth-mod-manager"
version = "0.1.0"
description = "BETH Mod Manager: a mod manager for Bethesda games installed through Lutris/Wine on Linux"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PyYAML>=5.4"]

[project.optional-dependencies]
# 6.12.0 drops a reference to True on every signal emitted from Python; on
# Python 3.11 that crashes the app after a few thousand (bethmm.gui checks).
gui = ["PySide6-Essentials>=6.5,!=6.12.0"]
dev = ["pytest>=7"]
# The GUI tests (pytest-qt refuses to start without a Qt binding).
gui-dev = ["pytest-qt>=4"]

[project.scripts]
bethmm = "bethmm.cli:main"

[project.gui-scripts]
bethmm-gui = "bethmm.gui:main"

[tool.setuptools.packages.find]
include = ["bethmm*"]

[tool.setuptools.package-data]
"bethmm.gui" = ["*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
